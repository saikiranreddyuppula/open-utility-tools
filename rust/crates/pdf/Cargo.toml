[package]
name = "pdf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "PDF merge/split/rotate/metadata (wasm) via lopdf, plus table/image PDF building."

[lib]
crate-type = ["cdylib", "rlib"]

# See rust/crates/core/Cargo.toml for why these wasm-opt flags are needed.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Os",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-reference-types",
  "--enable-multivalue",
]

[dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true

# Pure-Rust PDF library (default features: chrono + nom_parser + embed_image +
# rayon). rayon-core compiles on wasm32 with a sequential fallback, so this is
# fine. lopdf 0.36's features can't be selected individually (index quirk), so we
# keep defaults rather than fight the resolver.
lopdf = "0.36"

# lopdf transitively needs getrandom; on wasm32-unknown-unknown its 0.3 line
# requires the `wasm_js` backend feature + the matching cfg (set in
# rust/.cargo/config.toml). This pulls entropy from crypto.getRandomValues.
getrandom = { version = "0.3", features = ["wasm_js"] }
