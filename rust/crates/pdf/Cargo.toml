[package]
name = "pdf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "PDF merge/split/rotate/metadata (wasm) via lopdf, plus table/image PDF building."

[lib]
crate-type = ["cdylib", "rlib"]

# See rust/crates/core/Cargo.toml for why these wasm-opt flags are needed.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Os",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-reference-types",
  "--enable-multivalue",
]

[dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true

# Pure-Rust PDF library — compiles to wasm32-unknown-unknown. Default features
# (chrono + nom parser + embed_image) resolve cleanly; lopdf has no threads/rayon
# dependency to strip.
lopdf = "0.36"
