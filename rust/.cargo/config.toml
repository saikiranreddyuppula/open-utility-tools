# getrandom 0.3 requires this cfg to select the JS backend on
# wasm32-unknown-unknown (entropy via crypto.getRandomValues). Harmless for
# crates that don't depend on getrandom. Applies to every crate built under
# rust/ (cargo searches up the directory tree for this file).
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
