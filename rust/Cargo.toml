# Cargo workspace for all WASM crates.
# Each crate under crates/* is built independently by scripts/build-wasm.sh
# (wasm-pack --target web) into public/wasm/<crate>/ and lazy-loaded per tool.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# Optimize every wasm crate for size — these ship to the browser.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
